<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Grateful &amp; Grounded Kids</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Source Sans 3', system-ui, sans-serif;
      background: #F5EDD8;
      color: #1C1208;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .admin-card {
      background: #fff;
      border-radius: 12px;
      padding: 3rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(28, 18, 8, .08);
    }
    .admin-card h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.75rem;
      margin-bottom: .5rem;
      color: #243D10;
    }
    .admin-card p {
      color: #5A4E37;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .admin-card .badge {
      display: inline-block;
      background: #EDE3C8;
      color: #5A4E37;
      font-size: .8rem;
      font-weight: 600;
      padding: .35rem .75rem;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 1.5rem;
    }
    .admin-card a {
      color: #4A7C2F;
      text-decoration: none;
    }
    .admin-card a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="admin-card">
    <div class="badge">Coming Soon</div>
    <h1>Admin Dashboard</h1>
    <p>The content management system for Grateful &amp; Grounded Kids is being set up. Once configured, you'll be able to manage documents, update content, and handle form submissions from here.</p>
    <p style="font-size:.9rem;color:#8C7D64;">This will be powered by <strong>Decap CMS</strong> backed by your GitHub repository.</p>
    <p><a href="/">← Back to site</a></p>
  </div>
</body>
</html>
